<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRUD – Lista Ligada Simples</title>
  <style>
    :root { color-scheme: light; --bg: #f4f6fb; --card: #fff; --text: #1d2433; --muted: #5d6678; --accent: #2859c5; --border: #dbe1ec; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); }
    main { width: min(760px, calc(100% - 32px)); margin: 40px auto; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px; box-shadow: 0 8px 28px #17264a0d; }
    h1 { margin: 0 0 8px; font-size: clamp(1.5rem, 4vw, 2rem); }
    .subtitle { margin: 0 0 24px; color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 22px; }
    button { border: 0; border-radius: 9px; padding: 11px 16px; font: inherit; font-weight: 650; cursor: pointer; background: var(--accent); color: white; }
    button.secondary { background: #e9eefb; color: #24458d; }
    button:hover { filter: brightness(.96); }
    button:focus-visible { outline: 3px solid #91b3ff; outline-offset: 2px; }
    .status { min-height: 24px; margin: 0 0 14px; color: var(--muted); }
    .status.error { color: #b42318; }
    .status.success { color: #167044; }
    .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    .list li { padding: 12px 14px; border: 1px solid var(--border); border-radius: 9px; background: #fbfcff; }
    .position { display: inline-block; min-width: 42px; color: var(--accent); font-weight: 750; }
    .empty { padding: 18px; border: 1px dashed #b8c3d6; border-radius: 10px; color: var(--muted); text-align: center; }
    .hint { margin: 22px 0 0; color: var(--muted); font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>Lista ligada simples</h1>
      <p class="subtitle">Exercício CRUD – Lista · Parte 1</p>
      <div class="actions">
        <button id="btn-listar" type="button">[1] Listar todos</button>
        <button id="btn-fim" type="button">[2] Inserir no fim</button>
        <button id="btn-posicao" type="button">[3] Inserir na posição</button>
        <button id="btn-sair" class="secondary" type="button">[4] Sair</button>
      </div>
      <p id="status" class="status" role="status" aria-live="polite">Escolha uma operação no menu.</p>
      <div id="resultado" aria-live="polite">
        <p class="empty">A lista está vazia.</p>
      </div>
      <p class="hint">As posições começam em zero. Os elementos são armazenados em nós ligados, não em um array.</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
